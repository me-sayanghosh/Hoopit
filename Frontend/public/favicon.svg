<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Rounded dark background -->
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="#1c1c2e"/>
  <!-- 2x2 grid of blue rounded squares -->
  <!-- Top-left -->
  <rect x="13" y="13" width="16" height="16" rx="4" ry="4" fill="#3b82f6"/>
  <!-- Top-right -->
  <rect x="35" y="13" width="16" height="16" rx="4" ry="4" fill="#3b82f6"/>
  <!-- Bottom-left -->
  <rect x="13" y="35" width="16" height="16" rx="4" ry="4" fill="#3b82f6"/>
  <!-- Bottom-right -->
  <rect x="35" y="35" width="16" height="16" rx="4" ry="4" fill="#3b82f6"/>
</svg>
